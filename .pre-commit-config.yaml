repos:
  # Python
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatter
        entry: ruff format
        language: python
        additional_dependencies: [ruff]
        types: [python]

      - id: ruff-lint
        name: Ruff linter
        entry: ruff check
        language: python
        additional_dependencies: [ruff]
        types: [python]

      - id: mypy
        name: Mypy type checker
        entry: uv run --project backend mypy
        language: system
        types: [python]

      - id: pytest
        name: Python tests
        entry: uv run --project backend pytest backend/tests
        language: system
        pass_filenames: false
        files: ^backend/
