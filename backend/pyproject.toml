[project]
name = "danky-maps-backend"
version = "0.1.0"
description = "backend"
readme = "README.md"
authors = [
    { name = "Daniel Wang", email = "dhw72@cornell.edu" },
    { name = "Fartleena Xin", email = "kx63@cornell.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
package = false
